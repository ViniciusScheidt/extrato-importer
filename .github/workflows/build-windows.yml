name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main", "build-exe"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name ImportadorExtrato app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImportadorExtrato-windows
          path: dist/ImportadorExtrato.exe